name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  # Tombol "Run workflow" manual di tab Actions
  workflow_dispatch:
  # Otomatis jalan setiap ada push ke main/master
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'

permissions:
  contents: write

env:
  # Nama yang tampil di aplikasi CloudStream (boleh kamu ganti)
  REPO_NAME: "Premix Repo"
  REPO_DESCRIPTION: "Kumpulan plugin CloudStream"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 1. Ambil source code ke folder "src"
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          path: "src"

      # 2. Siapkan folder "builds".
      #    Kalau branch "builds" sudah ada -> di-clone.
      #    Kalau belum ada -> dibuat otomatis (tidak error lagi).
      - name: Prepare builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" builds >/dev/null 2>&1; then
            echo "Branch builds sudah ada, di-clone."
            git clone --branch builds --single-branch --depth 1 "$REMOTE" "$GITHUB_WORKSPACE/builds"
          else
            echo "Branch builds belum ada, akan dibuat baru."
            mkdir -p "$GITHUB_WORKSPACE/builds"
          fi

      # 3. Bersihkan plugin lama (repo.json dibuat ulang otomatis di langkah 6)
      - name: Clean old builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -f ./*.cs3 ./*.jar ./plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      # 'packages' di-override karena paket lama 'tools' sudah dihapus Google
      # (kalau tidak di-override, sdkmanager error: Failed to find package 'tools')
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 3b. JitPack membangun plugin Gradle CloudStream saat pertama diminta.
      #     Tunggu sampai siap (maks ±6 menit) supaya build tidak gagal "Could not find ...gradle:master-SNAPSHOT".
      - name: Warm up JitPack
        run: |
          URL="https://jitpack.io/com/github/recloudstream/gradle/master-SNAPSHOT/maven-metadata.xml"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || true)
            echo "JitPack percobaan $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::warning::JitPack belum siap setelah ±6 menit, build tetap dilanjutkan"

      # 4. Build semua plugin
      #    - Seluruh output Gradle disimpan ke logs/build-log.txt
      #    - --continue: semua plugin tetap dicoba walau satu gagal (log lebih lengkap)
      #    - Coba ulang (maks 3x) HANYA kalau penyebabnya jaringan / gagal download dependency
      - name: Build plugins
        working-directory: src
        run: |
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/logs"
          LOG="$GITHUB_WORKSPACE/logs/build-log.txt"
          TMP="$RUNNER_TEMP/attempt.log"
          : > "$LOG"

          status=1
          for attempt in 1 2 3; do
            echo "===== Percobaan build ke-$attempt =====" | tee -a "$LOG"
            extra=""
            if [ "$attempt" -gt 1 ]; then extra="--refresh-dependencies"; fi

            set +e
            ./gradlew make makePluginsJson --stacktrace --continue --console=plain $extra 2>&1 | tee "$TMP"
            status=${PIPESTATUS[0]}
            set -e
            cat "$TMP" >> "$LOG"

            if [ "$status" -eq 0 ]; then
              break
            fi

            if grep -qE "Could not (resolve|find|GET|HEAD)|Read timed out|Connection (reset|refused)|Premature end of" "$TMP"; then
              if [ "$attempt" -lt 3 ]; then
                echo "Gagal download dependency, tunggu 90 detik lalu coba lagi..." | tee -a "$LOG"
                sleep 90
              fi
            else
              echo "Error kode/kompilasi (bukan masalah jaringan), tidak diulang." | tee -a "$LOG"
              break
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::error::Build gagal. Download artifact 'build-log' untuk log lengkap."
            exit "$status"
          fi

          ./gradlew ensureJarCompatibility --console=plain 2>&1 | tee -a "$LOG" || echo "::warning::ensureJarCompatibility gagal/tidak ada, dilewati"

      # 5. Kumpulkan hasil build ke folder "builds"
      - name: Collect build results
        run: |
          cd "$GITHUB_WORKSPACE/src"
          shopt -s nullglob

          if [ ! -f build/plugins.json ]; then
            echo "::error::build/plugins.json tidak ditemukan, build gagal"
            exit 1
          fi

          files=( */build/*.cs3 )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Tidak ada file .cs3 yang dihasilkan"
            exit 1
          fi
          cp "${files[@]}" "$GITHUB_WORKSPACE/builds/"

          jars=( */build/*.jar )
          if [ ${#jars[@]} -gt 0 ]; then
            cp "${jars[@]}" "$GITHUB_WORKSPACE/builds/"
          fi

          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"
          echo "Jumlah plugin .cs3: ${#files[@]}"

      # 6. Buat repo.json otomatis (selalu menunjuk ke repo kamu sendiri)
      - name: Generate repo.json
        run: |
          PLUGINS_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
          jq -n \
            --arg name "$REPO_NAME" \
            --arg desc "$REPO_DESCRIPTION" \
            --arg list "$PLUGINS_URL" \
            '{name: $name, description: $desc, manifestVersion: 1, pluginLists: [$list]}' \
            > "$GITHUB_WORKSPACE/builds/repo.json"
          cat "$GITHUB_WORKSPACE/builds/repo.json"

      # 7. Push ke branch "builds" (history selalu 1 commit supaya repo tidak membengkak)
      - name: Push builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          rm -rf .git
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build update: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds

      # 8. Tampilkan link repo.json di ringkasan run
      - name: Show repo link
        run: |
          {
            echo "### Build selesai ✅"
            echo ""
            echo "Link yang ditempel di aplikasi CloudStream:"
            echo ""
            echo '```'
            echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/repo.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ===== Di bawah ini hanya jalan kalau build GAGAL =====

      # 9. Cek status JitPack (penyedia plugin Gradle CloudStream), disimpan ke logs/
      - name: JitPack diagnostic
        if: failure()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          OUT="$GITHUB_WORKSPACE/logs/jitpack-check.txt"
          {
            echo "== maven-metadata.xml =="
            curl -s --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" https://jitpack.io/com/github/recloudstream/gradle/master-SNAPSHOT/maven-metadata.xml
            echo "== build.log JitPack (80 baris terakhir) =="
            curl -s --max-time 30 https://jitpack.io/com/github/recloudstream/gradle/master-SNAPSHOT/build.log | tail -n 80
          } > "$OUT" 2>&1 || true

      # 10. Ringkasan error singkat di halaman Summary
      - name: Summarize error
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/logs/build-log.txt"
          {
            echo "### ❌ Build gagal"
            echo ""
            echo "Download log lengkap: scroll ke bagian **Artifacts** di bawah halaman ini, lalu ketuk **build-log**."
            echo ""
            if [ -f "$LOG" ]; then
              echo "Error kompilasi (maks 25 baris):"
              echo '```'
              grep "^e: " "$LOG" | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/src/##' | sort -u | head -n 25 || true
              echo '```'
              echo "Task yang gagal:"
              echo '```'
              grep -oE "Execution failed for task '[^']+'" "$LOG" | sort -u || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 11. Upload log supaya bisa di-download (sukses maupun gagal)
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
